name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Abhängigkeiten installieren
        run: uv sync --locked

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Typen (pyright)
        run: uv run pyright

      - name: Tests (pytest)
        run: uv run pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Versionen konsistent?
        run: |
          python3 - <<'EOF'
          import json, tomllib
          versions = {
              "pyproject.toml": tomllib.load(open("pyproject.toml", "rb"))["project"]["version"],
              "manifest.json": json.load(open("manifest.json"))["version"],
              "server.json": json.load(open("server.json"))["version"],
          }
          for p in json.load(open("server.json"))["packages"]:
              if "version" in p:
                  versions[f"server.json ({p['registryType']})"] = p["version"]
          print(versions)
          assert len(set(versions.values())) == 1, "Versionen stimmen nicht überein"
          EOF

      - name: Python-Paket bauen
        run: uv build

      - uses: actions/setup-node@v5
        with:
          node-version: "lts/*"

      - name: Desktop Extension validieren und packen
        run: |
          npx -y @anthropic-ai/mcpb validate manifest.json
          npx -y @anthropic-ai/mcpb pack . garmin-connect.mcpb
