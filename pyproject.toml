[project]
name = "mcp-server-garmin-connect"
version = "0.4.0"
description = "A Model Context Protocol server for your own Garmin Connect data (activities, sleep, HRV, Body Battery, stress) via the Garmin Connect Personal API"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Flavio Waser" }]
keywords = ["garmin", "fitness", "training", "mcp", "llm"]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "garmin-connect-personal-api-python>=1.0.0",
    "mcp>=2.3.0,<3",
    "fitdecode>=0.11.0",
    "requests>=2.32",
]

[project.urls]
Repository = "https://github.com/flawas/garmin-mcp"
Issues = "https://github.com/flawas/garmin-mcp/issues"

[project.scripts]
mcp-server-garmin-connect = "mcp_server_garmin_connect:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]

[dependency-groups]
dev = [
    "pyright>=1.1.389",
    "ruff>=0.7.3",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "fit-tool>=0.9.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
